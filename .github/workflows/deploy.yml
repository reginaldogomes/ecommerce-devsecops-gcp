name: CD - Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build, push e captura do digest imutável
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/ecommerce-devsecops-gcp/api:${GITHUB_SHA}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy revisão canary sem tráfego
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gcloud run deploy ecommerce-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_DIGEST" \
            --service-account "$RUNTIME_SA" \
            --platform managed \
            --no-allow-unauthenticated \
            --no-traffic \
            --tag canary \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --cpu 1 \
            --quiet

      - name: Smoke test autenticado na revisão canary
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          CANARY_URL=$(gcloud run services describe ecommerce-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.traffic[?tag=="canary"].url)')
          ID_TOKEN=$(gcloud auth print-identity-token --audiences="$CANARY_URL")
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "${CANARY_URL}/health/live"
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "${CANARY_URL}/health/ready"

      - name: Promover tráfego para a nova revisão
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic ecommerce-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-latest \
            --quiet
          gcloud run services describe ecommerce-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)'
